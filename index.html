<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#050709">
<title>POCOYO OFC • Generador de Keys</title>
<style>
*{box-sizing:border-box} :root{color-scheme:dark} body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;background-color:#050709;background-image:linear-gradient(rgba(0,238,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,238,255,.035) 1px,transparent 1px);background-size:56px 56px;color:#f4f7fb;font-family:'Courier New',monospace}.app{width:min(100%,656px)}header{text-align:center;margin-bottom:24px}h1{margin:0;font-family:Arial,sans-serif;font-weight:900;font-size:clamp(28px,6vw,38px);letter-spacing:6px}h1 span{color:#00e9f5}.subtitle{margin:14px 0 0;color:#444b5d;font-size:12px;letter-spacing:4px}.panel{padding:28px;border-radius:13px;border:1px solid #1a1c25;background:rgba(13,14,19,.97);box-shadow:0 15px 50px #0005}
.info{border:1px solid #ffffff0b;background:#ffffff03;border-radius:8px;padding:13px 14px;margin-bottom:10px}.info.label{color:#51596c;font-size:10px;letter-spacing:2px;margin-bottom:7px;display:block}.info.value{font-size:14px;font-weight:bold;color:#f4f7fb}
.key-label{color:#51596c;font-size:11px;font-weight:bold;letter-spacing:4px;margin:22px 0 18px}.key{width:100%;min-height:84px;display:grid;place-items:center;padding:16px 10px;margin-bottom:28px;border:1px solid #00e9f5;border-radius:10px;background:#020405;color:#00e9f5;font-size:22px;letter-spacing:2px;text-align:center;box-shadow:0 0 24px #00e9f50f}
.dots span{display:inline-block;animation:bounce.8s infinite ease-in-out;color:#001015}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
button#action{width:100%;min-height:68px;border:0;border-radius:10px;cursor:pointer;background:#00dff0;color:#001015;font:900 17px 'Courier New',monospace;letter-spacing:4px;margin-top:32px}
.aviso-box{margin:0 0 28px; padding:18px 14px; border-radius:14px; border:2px solid #00e9f5; background:#0a0d11; text-align:center;}
.aviso-icon{font-size:22px; color:#00e9f5; margin-bottom:6px;}.aviso-title{color:#00e9f5; font-weight:900; font-size:18px; margin:0 0 8px;}.aviso-text{color:#fff; font-weight:900; font-size:15px; font-family:Arial,sans-serif;}
.hidden{display:none!important}
</style></head>
<body><main class="app"><header><h1>POCOYO <span>OFC</span></h1><p class="subtitle">FREE KEY — 365 DAYS</p></header><section class="panel">
<div id="postInfo" class="hidden">
<div class="info"><span class="label">KEY CREADA POR</span><div class="value">POCOYO OFC</div></div>
<div class="info"><span class="label">TIPO DE KEY</span><div class="value">FREE / GRATIS</div></div>
<div class="info"><span class="label">DURACIÓN</span><div class="value">365 DAYS</div></div>
</div>
<div id="keySection" class="hidden">
<div class="key-label">YOUR KEY</div>
<div class="key" id="key"></div>
<div class="aviso-box" id="aviso"><div class="aviso-icon">🛡️</div><div class="aviso-title">¡AVISO DE SEGURIDAD!</div><div class="aviso-text">NO COMPARTAS TU KEY CON NADIEN.</div></div>
</div>
<button id="action" type="button">GENERAR KEY</button></section></main>
<script>
const REDIRECT_URL='https://blacklink.site/no-se-xd';
if(location.protocol === 'file:'){ location.href = REDIRECT_URL; }
if(document.referrer && document.referrer.includes('blacklink.site')){ localStorage.setItem('hanzx_from_blacklink', Date.now().toString()); }
const last = parseInt(localStorage.getItem('hanzx_from_blacklink') || '0');
const expired = Date.now() - last > 70000;
if(expired){ window.location.href = REDIRECT_URL; }
try{ const nav = performance.getEntriesByType('navigation')[0]; const isReload = nav? nav.type === 'reload' : performance.navigation.type === 1; if(isReload){ window.location.href = REDIRECT_URL; } }catch(e){}
setTimeout(()=>{ window.location.href = REDIRECT_URL; }, 60000);
const KEY='20K', action=document.getElementById('action'), keyBox=document.getElementById('key'), keySection=document.getElementById('keySection'), postInfo=document.getElementById('postInfo');let generated=false;
action.addEventListener('click',async()=>{
if(!generated){
action.disabled=true; action.innerHTML='GENERANDO KEY<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
await new Promise(r=>setTimeout(r,1500));
keyBox.textContent=KEY; postInfo.classList.remove('hidden'); keySection.classList.remove('hidden');
action.disabled=false; action.textContent='COPIAR KEY'; generated=true; return
}
try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(KEY)}else{const t=document.createElement('textarea');t.value=KEY;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error()} action.textContent='✓ KEY COPIADA'; setTimeout(()=>action.textContent='COPIAR KEY',1800) }catch(e){ action.textContent='COPIAR KEY'; alert('MANTÉN PULSADA 20K PARA COPIAR'); }
});
</script></body></html>
